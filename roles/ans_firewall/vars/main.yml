  - RemoteEventLogSvc-NP-In-TCP
  - RemoteEventLogSvc-RPCSS-In-TCP
  - RemoteSvcAdmin-In-TCP
  - RemoteSvcAdmin-NP-In-TCP
  - RemoteSvcAdmin-RPCSS-In-TCP
  - RemoteFwAdmin-In-TCP
  - RemoteFwAdmin-RPCSS-In-TCP
  - FPS-NB_Session-In-TCP
