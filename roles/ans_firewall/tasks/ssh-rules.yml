---
# ---------- SSH rules ----------
# Allows SSH only from ans_firewall_ssh_ips (management IPs + ans_firewall_ssh_extra_ips).

- name: DEFOS | Firewall | Apply SSH rule
  community.windows.win_firewall_rule:
    name: ANS-OpenSSH-Server-In-TCP
    description: "Firewall rule allowing SSH access. [TCP 22]"
    group: "{{ ans_firewall_ssh_group }}"
    direction: in
    action: allow
    enabled: true
    profiles: "{{ ans_firewall_profile }}"
    protocol: TCP
    localport: "22"
    remoteip: "{{ (ans_firewall_ssh_ips | join(',')) if ans_firewall_enable_ssh_rules | bool else omit }}"
    state: "{{ 'present' if ans_firewall_enable_ssh_rules | bool else 'absent' }}"
  tags: [firewall, ssh]
