---
# roles/ans_firewall/tasks/disable-builtins.yml

# Only the rules a managed set replaces: with a set turned off, its built-ins are left as they are, so turning off
# RemoteAdmin cannot leave a host with no WinRM rule at all.
- name: DEFOS | Firewall | Disable the replaced rules (if present)
  ansible.windows.win_powershell:
    parameters:
      Names: >-
        {{ (ans_firewall__builtin_rdp if ans_firewall_enable_rdp_rules | bool else [])
        + (ans_firewall__builtin_remoteadmin if ans_firewall_enable_remoteadmin_rules | bool else [])
        + (ans_firewall__builtin_ssh if ans_firewall_enable_ssh_rules | bool else []) }}
      DisplayNames: >-
        {{ ans_firewall_winrm_extra_rules if ans_firewall_enable_remoteadmin_rules | bool else [] }}
    script: |
      [CmdletBinding(SupportsShouldProcess)]
      param(
        [string[]]$Names = @(),
        [string[]]$DisplayNames = @()
      )

      $Ansible.Changed = $false
      $rules = @(
        foreach ($name in $Names) { Get-NetFirewallRule -Name $name -ErrorAction SilentlyContinue }
        foreach ($name in $DisplayNames) { Get-NetFirewallRule -DisplayName $name -ErrorAction SilentlyContinue }
      )
      foreach ($rule in $rules) {
        if ($rule.Enabled -ne 'False') {
          $Ansible.Changed = $true
          if (-not $Ansible.CheckMode) { $rule | Disable-NetFirewallRule }
        }
      }
