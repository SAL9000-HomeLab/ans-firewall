---
# roles/ans_firewall/tasks/main.yml

- name: DEFOS | Firewall | Gather the OS family
  ansible.builtin.setup:
    gather_subset: [min]
  when:
    - ans_firewall_enable_firewall_rules | bool
    - ansible_facts['os_family'] is not defined
  tags: [always]

- name: DEFOS | Firewall | Windows Firewall rules
  ansible.builtin.import_tasks: windows.yml
  when:
    - ans_firewall_enable_firewall_rules | bool
    - ansible_facts['os_family'] == 'Windows'
  tags: [firewall]

# Off by default: cluster and container hosts run with firewalld off or manage their own ports.
- name: DEFOS | Firewall | Linux firewalld rules
  ansible.builtin.import_tasks: firewalld.yml
  when:
    - ans_firewall_enable_firewall_rules | bool
    - ansible_facts['os_family'] != 'Windows'
    - ans_firewall_firewalld_enabled | bool
  tags: [firewall, firewalld]
