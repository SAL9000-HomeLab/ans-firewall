---
# roles/ans_firewall/tasks/main.yml

- name: DEFOS | Firewall | Tasks
  when: ans_firewall_enable_firewall_rules | bool
  block:
    # An empty allowlist would create rules with no remote-address scope (open to any address).
    - name: DEFOS | Firewall | Check the management IP allowlists
      ansible.builtin.assert:
        that:
          - not (ans_firewall_enable_rdp_rules | bool or ans_firewall_enable_remoteadmin_rules | bool)
            or ans_firewall_mgmt_ips | length > 0
          - not ans_firewall_enable_ssh_rules | bool or ans_firewall_ssh_ips | length > 0
        fail_msg: >-
          Set ans_firewall_mgmt_ips (and ans_firewall_ssh_extra_ips if needed) on the inventory or group, or turn
          off the RDP, RemoteAdmin and SSH rules.
        quiet: true
      tags: [firewall, rdp, remoteadmin, ssh, validate]

    - name: DEFOS | Firewall | Disable built-in rules (once)
      ansible.builtin.import_tasks: disable-builtins.yml
      when: ans_firewall_disable_builtin_rules | bool
      tags: [firewall, builtin]

    - name: DEFOS | Firewall | Create RDP management rules
      ansible.builtin.import_tasks: rdp-rules.yml
      tags: [firewall, rdp]

    - name: DEFOS | Firewall | Create managed rules (RemoteAdmin)
      ansible.builtin.import_tasks: remoteadmin-rules.yml
      tags: [firewall, remoteadmin]

    - name: DEFOS | Firewall | Create SSH rules
      ansible.builtin.import_tasks: ssh-rules.yml
      tags: [firewall, ssh]

    - name: DEFOS | Firewall | Create SQL Server rules
      ansible.builtin.import_tasks: mssql-rules.yml
      when: ans_firewall_enable_mssql_rules | bool
      tags: [firewall, mssql, sql]
