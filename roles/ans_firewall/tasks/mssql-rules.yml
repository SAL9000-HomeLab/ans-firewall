---
# ---------- SQL Server rules ----------
# Opt-in. Scoped to ans_firewall_mssql_ips when that is set, otherwise open to any address.
- name: DEFOS | Firewall | Define SQL Server rule set
  ansible.builtin.set_fact:
    ans_firewall_firewall_rules_mssql:
      - { name: "{{ ans_firewall_rule_prefix_mssql }}-In-TCP",
          desc: "SQL Server Database connectivity (TCP-In) [TCP {{ ans_firewall_mssql_tcp_ports | join(', ') }}]",
          protocol: "TCP",
          localport: "{{ ans_firewall_mssql_tcp_ports | join(',') }}" }

      - { name: "{{ ans_firewall_rule_prefix_mssql }}-In-UDP",
          desc: "SQL Server Database connectivity (UDP-In) [UDP {{ ans_firewall_mssql_udp_ports | join(', ') }}]",
          protocol: "UDP",
          localport: "{{ ans_firewall_mssql_udp_ports | join(',') }}" }
  tags: [firewall, mssql, sql]

- name: DEFOS | Firewall | Apply SQL Server rules
  community.windows.win_firewall_rule:
    name: "{{ item.name }}"
    description: "{{ item.desc }}"
    group: "{{ ans_firewall_mssql_group }}"
    direction: in
    action: allow
    enabled: true
    profiles: "{{ ans_firewall_profile }}"
    protocol: "{{ item.protocol }}"
    localport: "{{ item.localport }}"
    remoteip: "{{ (ans_firewall_mssql_ips | join(',')) if ans_firewall_mssql_ips | length > 0 else omit }}"
    state: "{{ 'present' if ans_firewall_enable_mssql_rules | bool else 'absent' }}"
  loop: "{{ ans_firewall_firewall_rules_mssql }}"
  loop_control: { label: "{{ item.name }}" }
  tags: [firewall, mssql, sql]
