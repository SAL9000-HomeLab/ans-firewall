---
# roles/ans_firewall/defaults/main.yml

# --- Global toggles ---
ans_firewall_enable_firewall_rules: true
ans_firewall_enable_rdp_rules: true
ans_firewall_enable_remoteadmin_rules: true
ans_firewall_disable_builtin_rules: true
ans_firewall_enable_ssh_rules: true
ans_firewall_enable_mssql_rules: false   # opt-in: only enable on hosts running SQL Server

# --- Common group/prefix for rules we manage ---
ans_firewall_group: ANS_remoteadmin_base     # group used by remoteadmin-rules.yml only
ans_firewall_rule_prefix_rem: "ANS-RemAdm"
ans_firewall_rule_prefix_mssql: "ANS-SQL"   # e.g., ANS-SQL-In-TCP

# --- RDP management rule group ---
# Replaces the built-in RDP rules with scoped ones.
ans_firewall_rdp_mgmt_group: ANS_rdp_mgmt

# --- SQL Server rule group/ports ---
ans_firewall_mssql_group: ANS_mssql
# Addresses allowed to reach SQL Server. Empty means any address.
ans_firewall_mssql_ips: []
ans_firewall_mssql_tcp_ports:
  - 1433
  - 1434
  - 1435
  - 5022
ans_firewall_mssql_udp_ports:
  - 1434
  - 3343

# --- Profiles to apply (Domain, Private, Public) ---
ans_firewall_profile:
  - Domain
  - Private
  - Public

# --- Management IPs (allowlist for inbound access) ---
# Required when RDP, RemoteAdmin or SSH rules are enabled: the addresses allowed in, reused by the RDP and
# RemoteAdmin rules. IPv4 addresses or CIDR ranges. Set the real list on the AWX inventory or group, e.g.
# [192.0.2.10, 198.51.100.0/24]; the role fails rather than creating rules without a remote-address scope.
# Include the address Ascender jobs connect from, or the host stops answering them.
ans_firewall_mgmt_ips: []

# --- RDP allowlist (= mgmt IPs + these) ---
# Extra addresses allowed RDP on port 3389 only, such as the Kubernetes nodes a remote desktop gateway connects from.
ans_firewall_rdp_extra_ips: []

ans_firewall_rdp_ips: "{{ (ans_firewall_mgmt_ips + ans_firewall_rdp_extra_ips) | unique }}"

# --- SSH allowlist (= mgmt IPs + these) ---
# Extra addresses allowed SSH only, such as a monitoring server.
ans_firewall_ssh_extra_ips: []

ans_firewall_ssh_ips: "{{ (ans_firewall_mgmt_ips + ans_firewall_ssh_extra_ips) | unique }}"

# --- SSH rule group ---
ans_firewall_ssh_group: ANS_ssh

# --- WinRM rules added outside this role (by display name) ---
# Open to any address, so they would defeat the allowlist. Disabled along with the built-ins once the scoped
# RemoteAdmin rules exist. These are the ones vm-templates and proxmox-deploy create.
ans_firewall_winrm_extra_rules:
  - WinRM-HTTP
  - WinRM-HTTPS

# --- Linux: firewalld (RedHat family) ---
# Off by default. Turn it on per group: hosts that run with firewalld off (RKE2 nodes) should stay off.
ans_firewall_firewalld_enabled: false

# Zone the rules go in: the zone of the host's interface.
ans_firewall_firewalld_zone: public

# Services allowed only from ans_firewall_ssh_ips (ans_firewall_mgmt_ips + ans_firewall_ssh_extra_ips).
ans_firewall_firewalld_mgmt_services:
  - ssh

# Services taken out of the zone, so they are no longer open to any address.
ans_firewall_firewalld_remove_services:
  - ssh
  - cockpit
